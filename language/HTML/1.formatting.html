<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formatting</title>
</head>
<body>
    <h1>text formatting elements</h1>
    <p>1. this is <b>bold</b></p>
    <p>2. this is <em>emphasized</em></p>
    <p>3. this <i>i</i></p>
    <p>4. this <small>small</small></p>
    <p>5. this <strong>strong</strong></p>
    <p>6. this <sub>subscripted</sub></p>
    <p>7. this <sup>superscripted</sup></p>
    <p>8. this <ins>inserted</ins></p>
    <p>9. this <del>deleted</del></p>
    <p>this <mark>mark</mark></p>
</body>
</html>
